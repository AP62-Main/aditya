<!DOCTYPE html>
<head>
  <title>Hover Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2c2c2c;
    }

    .card {
      position: relative;
      width: 250px;
      padding: 20px;
      border-radius: 12px;
      background: #cbcbcb;
      box-shadow: 0 4px 12px rgb(229, 229, 229);
      transition: transform 0.3s ease;
      overflow: hidden;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card:hover::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 123, 255, 0.1);
      z-index: 0;
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .emoji {
      font-size: 2rem;
      margin: 5px 0;
    }

    .sentence {
      font-size: 1rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-content">
      <div class="name">Aditya</div>
      <div class="emoji">🥺</div>
      <div class="sentence">im sory maam😞.</div>
    </div>
  </div>

</body>
</html>
